name: CI
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:
    workflow_call:

# Least privilege for every job here: they check out, install, test and upload coverage, and none
# writes to the repository. Set at workflow level rather than on the job this branch adds, because
# `test` and `e2e` were relying on the repository default too -- pinning one job and leaving its
# siblings open would read as though the others had been considered and approved.
permissions:
    contents: read

jobs:
    test:
        strategy:
            matrix:
                # Latest resolutions run everywhere; the SPEC 0 minimum
                # (lowest-direct) runs on ubuntu with the oldest supported
                # Python, since floor versions predate newer interpreters'
                # wheels.
                python-version: ['3.13', '3.14', '3.15']
                os: [ubuntu-latest, macos-latest]
                resolution: [highest]
                include:
                    - os: ubuntu-latest
                      python-version: '3.13'
                      resolution: lowest-direct
        runs-on: ${{ matrix.os }}
        # GWMOCK_SIGNAL_CACHE_DIR is a base: gwmock-signal keeps the tables in `.ephemeris-cache/ephemeris/`.
        # Pinned so the cache step below saves and restores the path gwmock-signal reads, whose default
        # is platform-dependent.
        env:
            GWMOCK_SIGNAL_CACHE_DIR: ${{ github.workspace }}/.ephemeris-cache
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
              with:
                  python-version: ${{ matrix.python-version }}
                  enable-cache: 'true'

            - name: Install dependencies
              env:
                  RESOLUTION: ${{ matrix.resolution }}
              run: |
                  if [ "$RESOLUTION" = "lowest-direct" ]; then
                      uv sync --group dev --upgrade --resolution lowest-direct
                  else
                      uv sync --group dev --upgrade
                  fi

            # The solar-system delays, on by default for every compact-binary and burst projection, and
            # the continuous-wave barycentring read the LALPulsar ephemeris tables, which gwmock-signal
            # fetches from git.ligo.org on first use and caches. Without this every job on every run
            # would pull them from that service, and fail whenever it is down.
            #
            # The identifier is derived from `tests/data/ephemeris.sha256`, which records what the tables
            # should contain, so accepting new upstream content invalidates the cache in the same commit
            # that records it. `actions/cache` does not re-save on an exact hit, so a fixed identifier
            # would leave a newly added table downloading on every job.
            - name: Cache LALPulsar ephemeris tables
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
              with:
                  path: ${{ github.workspace }}/.ephemeris-cache
                  key:
                      lalpulsar-ephemeris-${{
                      hashFiles('tests/data/ephemeris.sha256') }}

            # Warms the cache on a miss and fails the job if it cannot, which reads better than tests
            # erroring with a stack trace ending in urllib. Reading the tables also verifies them:
            # gwmock-signal refuses a default table whose SHA-256 is not the one it records, the same
            # values as `tests/data/ephemeris.sha256`. What the cache does not cover: GitHub evicts it
            # after 7 days without access, and fork pull requests never restore it.
            - name: Fetch and verify the ephemeris tables
              env:
                  FETCH: |
                      import sys
                      from gwmock_signal.projection.solar_system import SolarSystemEphemeris
                      try:
                          SolarSystemEphemeris().tables()
                      except ValueError as exc:
                          print(exc, file=sys.stderr)
                          sys.exit(2)
              run: |
                  # Exit 2 is a table refused for its content, cached or downloaded: retrying cannot fix it.
                  for attempt in 1 2 3; do
                      uv run --no-sync python -c "$FETCH" && exit 0 || status=$?
                      if [ "$status" -eq 2 ]; then
                          echo "::error::an ephemeris table was refused for its content (see above); retrying" \
                               "cannot fix that -- clear the cache, or update tests/data/ephemeris.sha256 to match gwmock-signal's record"
                          exit 1
                      fi
                      if [ "$attempt" -lt 3 ]; then
                          echo "ephemeris fetch attempt $attempt failed; retrying"
                          sleep $((attempt * 10))
                      fi
                  done
                  echo "::error::could not fetch or verify the LALPulsar ephemeris tables from git.ligo.org" \
                       "after three attempts; the projection's solar-system delays need them"
                  exit 1

            - name: Run tests with pytest
              run: uv run --no-sync pytest

            - name: Upload coverage to Codecov
              if: ${{ !cancelled() }}
              uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}

    # End-to-end runs, kept out of the `test` matrix on purpose. They drive example configs
    # through the real CLI and generate data, so they are minutes rather than seconds -- running
    # them across seven interpreter/OS combinations would multiply that for no added signal,
    # since what they exercise is orchestration rather than anything interpreter-specific.
    #
    # The `jax` extra is load-bearing for the ripplegw-gated entries: with a plain `uv sync` those
    # would skip, and the job would report green while testing less than it claims. The guard step
    # below turns that from a silent skip into a failure.
    #
    # Extras are named explicitly rather than `--all-extras`, because `cuda` pulls multi-gigabyte
    # CUDA wheels that this runner has no GPU to use. The cost of naming them is that a new extra
    # is not picked up here automatically -- add it to this line when one is introduced.
    #
    # It does *not* cover the gengli entry. gengli is not a declared extra of this project at all,
    # so no sync flag can install it, and that entry is separately blocked on a local glitch
    # fixture. It stays skipped here -- see NOT_HERMETIC in tests/e2e/overlay.py.
    #
    # `deepextractor` is named for a different reason: its entry is *not* run. The extra supplies
    # `huggingface_hub`, which the matrix declares as that entry's requirement and which the guard
    # step therefore checks for -- but the backend then downloads a 2.3 GB dataset, which is too
    # slow to fetch on every run, so the entry is in NOT_HERMETIC and skips. Installing the extra
    # keeps that guard honest: what was declined is the data, not the dependency.
    test-jax:
        # The ripple/JAX-gated unit tests, which the `test` job cannot reach: it installs the dev
        # group only, so every `importorskip("ripplegw")` there skips. That left the
        # continuous-wave orchestration tests -- and the device-path tests -- running nowhere in
        # CI while the suite reported green.
        #
        # One cell rather than the six of `test`: this exists to run the gated tests at all, and
        # the code it covers is the same on every interpreter. Widen it if a version-specific
        # failure ever appears.
        runs-on: ubuntu-latest
        # GWMOCK_SIGNAL_CACHE_DIR is a base: gwmock-signal keeps the tables in `.ephemeris-cache/ephemeris/`.
        # Pinned so the cache step below saves and restores the path gwmock-signal reads, whose default
        # is platform-dependent.
        env:
            GWMOCK_SIGNAL_CACHE_DIR: ${{ github.workspace }}/.ephemeris-cache
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
              with:
                  python-version: '3.13'
                  enable-cache: 'true'

            - name: Install dependencies with the JAX extra
              run: uv sync --group dev --extra jax

            - name: Confirm ripple is importable
              # Otherwise this job silently becomes the thing it was added to fix: every gated test
              # skips and the job still reports green.
              run: uv run --no-sync python -c "import ripplegw"

            # The solar-system delays, on by default for every compact-binary and burst projection, and
            # the continuous-wave barycentring read the LALPulsar ephemeris tables, which gwmock-signal
            # fetches from git.ligo.org on first use and caches. Without this every job on every run
            # would pull them from that service, and fail whenever it is down.
            #
            # The identifier is derived from `tests/data/ephemeris.sha256`, which records what the tables
            # should contain, so accepting new upstream content invalidates the cache in the same commit
            # that records it. `actions/cache` does not re-save on an exact hit, so a fixed identifier
            # would leave a newly added table downloading on every job.
            - name: Cache LALPulsar ephemeris tables
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
              with:
                  path: ${{ github.workspace }}/.ephemeris-cache
                  key:
                      lalpulsar-ephemeris-${{
                      hashFiles('tests/data/ephemeris.sha256') }}

            # Warms the cache on a miss and fails the job if it cannot, which reads better than tests
            # erroring with a stack trace ending in urllib. Reading the tables also verifies them:
            # gwmock-signal refuses a default table whose SHA-256 is not the one it records, the same
            # values as `tests/data/ephemeris.sha256`. What the cache does not cover: GitHub evicts it
            # after 7 days without access, and fork pull requests never restore it.
            - name: Fetch and verify the ephemeris tables
              env:
                  FETCH: |
                      import sys
                      from gwmock_signal.projection.solar_system import SolarSystemEphemeris
                      try:
                          SolarSystemEphemeris().tables()
                      except ValueError as exc:
                          print(exc, file=sys.stderr)
                          sys.exit(2)
              run: |
                  # Exit 2 is a table refused for its content, cached or downloaded: retrying cannot fix it.
                  for attempt in 1 2 3; do
                      uv run --no-sync python -c "$FETCH" && exit 0 || status=$?
                      if [ "$status" -eq 2 ]; then
                          echo "::error::an ephemeris table was refused for its content (see above); retrying" \
                               "cannot fix that -- clear the cache, or update tests/data/ephemeris.sha256 to match gwmock-signal's record"
                          exit 1
                      fi
                      if [ "$attempt" -lt 3 ]; then
                          echo "ephemeris fetch attempt $attempt failed; retrying"
                          sleep $((attempt * 10))
                      fi
                  done
                  echo "::error::could not fetch or verify the LALPulsar ephemeris tables from git.ligo.org" \
                       "after three attempts; the projection's solar-system delays need them"
                  exit 1

            # Asserts the outcome, not just the prerequisites. Everything above removes a *reason*
            # to skip -- the extra is installed, the tables are present and verified -- but nothing
            # so far would notice a re-added `skipif`, a renamed module or a changed marker quietly
            # emptying this job, which is the exact failure it was added to fix. So the
            # continuous-wave modules are run by name and the report is read back: zero collected,
            # or anything skipped, fails.
            - name: Confirm the continuous-wave tests actually ran
              run: |
                  uv run --no-sync pytest --no-cov -q \
                      --junitxml=cw-report.xml \
                      tests/cli/test_continuous_wave_orchestration.py \
                      tests/cli/test_continuous_wave_wiring.py
                  uv run --no-sync python - <<'CHECK'
                  import sys
                  import xml.etree.ElementTree as ET

                  suite = ET.parse("cw-report.xml").getroot().find("testsuite")
                  total = int(suite.get("tests", 0))
                  skipped = int(suite.get("skipped", 0))
                  print(f"continuous-wave tests: {total} collected, {skipped} skipped")
                  if total == 0:
                      print("::error::no continuous-wave tests were collected; this job is a no-op")
                      sys.exit(1)
                  if skipped:
                      print(f"::error::{skipped} continuous-wave test(s) skipped; this job exists "
                            "because they silently stopped running once already")
                      sys.exit(1)
                  CHECK

            - name: Run tests with pytest (JAX backend)
              run: uv run --no-sync pytest

            - name: Upload coverage to Codecov (JAX backend)
              if: ${{ !cancelled() }}
              uses: codecov/codecov-action@0fb7174895f61a3b6b78fc075e0cd60383518dac # v5
              with:
                  token: ${{ secrets.CODECOV_TOKEN }}
                  flags: jax

    test-core:
        # The newest Python, where h5py publishes no wheel yet, so neither h5py nor GWpy installs. The
        # package installs with its core dependencies only, and everything except frame files works
        # there without importing either: HDF5 goes through gwmock-data's own HDF5 support. Only the package and pytest are installed, and
        # the tests run against the installed package rather than the source tree.
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  persist-credentials: false

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
              with:
                  python-version: '3.15'

            - name: Install the package and pytest only
              run: |
                  uv venv
                  uv pip install . pytest

            - name: Run the core-dependency tests
              run: >-
                  uv run --no-sync pytest -p no:cacheprovider --noconftest -o
                  addopts= -o pythonpath= tests/test_core_install.py
                  tests/test_lazy_imports.py tests/test_optional.py
                  tests/test_nested_hdf5_datasets.py

    e2e:
        runs-on: ubuntu-latest
        # The same ephemeris pinning as `test` and `test-jax`, because jobs do not share a filesystem
        # and every signal entry runs *here*: the compact-binary ones read the tables for the
        # solar-system delays, the continuous-wave one for its barycentring. The references were
        # generated against the tables `tests/data/ephemeris.sha256` records, so a table that differed
        # would be compared against them and pass whenever the difference stayed inside tolerance.
        env:
            GWMOCK_SIGNAL_CACHE_DIR: ${{ github.workspace }}/.ephemeris-cache
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  # This job runs example configurations, which fetch remote inputs. Nothing here
                  # needs to push, so the checkout token is not left in .git/config where a
                  # subsequent step could reach it.
                  persist-credentials: false

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
              with:
                  python-version: '3.13'
                  enable-cache: 'true'

            # `deepextractor` is here for the guard step below, which reads every `requires` in
            # the matrix: the DeepExtractor entry declares `huggingface_hub`, so the extra has to
            # be installed for that check to pass. The entry itself still skips -- running it
            # means downloading a 2.3 GB dataset, which is why it sits in NOT_HERMETIC.
            - name: Install dependencies
              run:
                  uv sync --group dev --extra sgwb --extra jax --extra
                  deepextractor

            - name: Confirm the optional stack is present
              # Otherwise a missing extra turns the whole job into a silent no-op: every gated
              # entry skips and the job still passes.
              #
              # The required modules are read from `E2E_MATRIX` rather than listed here, so adding a
              # matrix entry with a new `requires` cannot leave this check behind. `gengli` is the
              # documented exception: it is not an extra of this project, and its entry is labelled
              # "not run" -- see NOT_HERMETIC in tests/e2e/overlay.py.
              run: |
                  uv run --no-sync python -c "
                  import importlib.util as u, sys
                  sys.path.append('tests')  # append, not insert: tests/signal would shadow stdlib signal
                  from e2e.matrix import E2E_MATRIX
                  needed = {m for e in E2E_MATRIX for m in e.requires} - {'gengli'}
                  missing = sorted(m for m in needed if u.find_spec(m) is None)
                  sys.exit('e2e job is missing: ' + ', '.join(missing) if missing else 0)
                  "

            # The solar-system delays, on by default for every compact-binary and burst projection, and
            # the continuous-wave barycentring read the LALPulsar ephemeris tables, which gwmock-signal
            # fetches from git.ligo.org on first use and caches. Without this every job on every run
            # would pull them from that service, and fail whenever it is down.
            #
            # The identifier is derived from `tests/data/ephemeris.sha256`, which records what the tables
            # should contain, so accepting new upstream content invalidates the cache in the same commit
            # that records it. `actions/cache` does not re-save on an exact hit, so a fixed identifier
            # would leave a newly added table downloading on every job.
            - name: Cache LALPulsar ephemeris tables
              uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
              with:
                  path: ${{ github.workspace }}/.ephemeris-cache
                  key:
                      lalpulsar-ephemeris-${{
                      hashFiles('tests/data/ephemeris.sha256') }}

            # Warms the cache on a miss and fails the job if it cannot, which reads better than tests
            # erroring with a stack trace ending in urllib. Reading the tables also verifies them:
            # gwmock-signal refuses a default table whose SHA-256 is not the one it records, the same
            # values as `tests/data/ephemeris.sha256`. What the cache does not cover: GitHub evicts it
            # after 7 days without access, and fork pull requests never restore it.
            - name: Fetch and verify the ephemeris tables
              env:
                  FETCH: |
                      import sys
                      from gwmock_signal.projection.solar_system import SolarSystemEphemeris
                      try:
                          SolarSystemEphemeris().tables()
                      except ValueError as exc:
                          print(exc, file=sys.stderr)
                          sys.exit(2)
              run: |
                  # Exit 2 is a table refused for its content, cached or downloaded: retrying cannot fix it.
                  for attempt in 1 2 3; do
                      uv run --no-sync python -c "$FETCH" && exit 0 || status=$?
                      if [ "$status" -eq 2 ]; then
                          echo "::error::an ephemeris table was refused for its content (see above); retrying" \
                               "cannot fix that -- clear the cache, or update tests/data/ephemeris.sha256 to match gwmock-signal's record"
                          exit 1
                      fi
                      if [ "$attempt" -lt 3 ]; then
                          echo "ephemeris fetch attempt $attempt failed; retrying"
                          sleep $((attempt * 10))
                      fi
                  done
                  echo "::error::could not fetch or verify the LALPulsar ephemeris tables from git.ligo.org" \
                       "after three attempts; the projection's solar-system delays need them"
                  exit 1

            - name: Run end-to-end tests
              run:
                  uv run --no-sync pytest -m e2e --no-cov
                  --junitxml=e2e-report.xml

            # The same outcome check the continuous-wave unit modules get, for the same reason. The
            # e2e tests call `skip_if_unavailable(entry)` before running, so a matrix entry can skip
            # itself -- a missing extra, or an entry put back into NOT_HERMETIC -- and this job would
            # still report green. `NOT_HERMETIC` entries are expected to skip and are read from the
            # source of truth rather than listed here, so adding one cannot leave this check behind.
            - name: Confirm every runnable matrix entry actually ran
              if: ${{ !cancelled() }}
              run: |
                  uv run --no-sync python - <<'CHECK'
                  import sys
                  import xml.etree.ElementTree as ET

                  sys.path.append("tests")  # append: tests/signal would shadow stdlib signal
                  from e2e.matrix import E2E_MATRIX
                  from e2e.overlay import NOT_HERMETIC

                  expected_to_skip = set(NOT_HERMETIC)
                  runnable = [e.label for e in E2E_MATRIX if e.label not in expected_to_skip]

                  root = ET.parse("e2e-report.xml").getroot()
                  cases = list(root.iter("testcase"))
                  if not cases:
                      print("::error::the e2e run collected no tests at all")
                      sys.exit(1)

                  missing = []
                  for label in runnable:
                      mine = [c for c in cases if label in (c.get("name") or "")]
                      if not mine:
                          missing.append(f"{label}: no test referenced it")
                      elif all(c.find("skipped") is not None for c in mine):
                          missing.append(f"{label}: every test referencing it skipped")
                  if missing:
                      print("::error::matrix entries that did not run, though not in NOT_HERMETIC:")
                      for line in missing:
                          print(f"::error::{line}")
                      sys.exit(1)
                  print(f"all {len(runnable)} runnable matrix entries ran")
                  CHECK
