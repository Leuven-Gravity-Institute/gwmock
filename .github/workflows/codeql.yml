name: CodeQL
on:
    push:
        branches: [main]
    pull_request:
        branches: [main]
    workflow_dispatch:
    workflow_call:

permissions:
    security-events: write

jobs:
    codeql:
        name: codeql
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

            - name: Initialize CodeQL
              uses: github/codeql-action/init@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
              with:
                  languages: python

            - name: Autobuild
              uses: github/codeql-action/autobuild@24c54180a607b1449ed407dd24f251e4e9147c8d # v4

            - name: Perform CodeQL Analysis
              uses: github/codeql-action/analyze@24c54180a607b1449ed407dd24f251e4e9147c8d # v4
