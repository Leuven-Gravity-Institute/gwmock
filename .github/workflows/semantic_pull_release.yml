name: 'Lint PR'

on:
    pull_request:
        types:
            - opened
            - reopened
            - edited
            - synchronize

jobs:
    main:
        name: Validate PR title
        runs-on: ubuntu-slim
        permissions:
            pull-requests: read
        steps:
            - uses: amannn/action-semantic-pull-request@66e72920af32222769c386d81f89656ebcb6d6d5 # v6
              env:
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
