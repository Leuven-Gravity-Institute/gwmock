name: Publish to PyPI

on:
    workflow_dispatch:
        inputs:
            tag_name:
                description: 'Tag name for the publish (e.g., v1.2.3)'
                required: true
                type: string
    workflow_call:
        inputs:
            tag_name:
                description: 'Tag name for the publish (e.g., v1.2.3)'
                required: true
                type: string

jobs:
    publish:
        runs-on: ubuntu-latest
        environment:
            name: pypi
        permissions:
            id-token: write
            contents: read
        steps:
            - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
              with:
                  ref: ${{ inputs.tag_name || github.event.inputs.tag_name }}
                  fetch-depth: 0

            - name: Output build information
              run: |
                  echo "### Publishing Build :package:" >> $GITHUB_STEP_SUMMARY
                  echo "- **Version tag**: ${{ inputs.tag_name || github.event.inputs.tag_name }}" >> $GITHUB_STEP_SUMMARY

            - name: Install uv
              uses: astral-sh/setup-uv@37802adc94f370d6bfd71619e3f0bf239e1f3b78 # v7
              with:
                  python-version: '3.13'
                  enable-cache: 'true'

            - name: Install dependencies
              run: uv sync --group dev --frozen

            - name: Build distribution
              run: uv build

            - name: Smoke test (wheel)
              run:
                  uv run --isolated --no-project --with dist/*.whl
                  tests/smoke_test.py

            - name: Smoke test (source distribution)
              run:
                  uv run --isolated --no-project --with dist/*.tar.gz
                  tests/smoke_test.py

            # uv publish uploads PEP 740 attestations but does not make them: without this step PyPI
            # shows no provenance for the release. Uses the trusted-publishing token of this job.
            - name: Generate PEP 740 attestations
              uses: astral-sh/attest-action@39b6ce43875c196a579e31635b11aa2a2036384a # v0.0.7

            - name: Publish to PyPI
              run: uv publish
