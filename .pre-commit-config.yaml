ci:
    autoupdate_schedule: quarterly
    autofix_prs: true
    autoupdate_commit_msg: 'chore(deps): [pre-commit.ci] autoupdate'
    autofix_commit_msg: 'chore: [pre-commit.ci] autofix'

repos:
    - repo: https://github.com/pre-commit/pre-commit-hooks
      rev: v6.0.0
      hooks:
          - id: check-added-large-files
          - id: check-case-conflict
          - id: check-merge-conflict
          - id: check-symlinks
          - id: check-yaml
          - id: check-toml
          - id: debug-statements
          - id: end-of-file-fixer
          - id: mixed-line-ending
          - id: trailing-whitespace
          - id: check-docstring-first
          - id: check-json

    - repo: https://github.com/astral-sh/ruff-pre-commit
      rev: v0.16.6
      hooks:
          - id: ruff-check
            args: [--fix, --config=pyproject.toml]
          - id: ruff-format

    - repo: https://github.com/crate-ci/typos
      rev: v1.50.1
      hooks:
          - id: typos
            args: []

    - repo: https://github.com/ComPWA/taplo-pre-commit
      rev: v0.9.3
      hooks:
          - id: taplo-format

    - repo: https://github.com/rbubley/mirrors-prettier
      rev: v3.9.6
      hooks:
          - id: prettier
            stages: [pre-commit]
            # The end-to-end reference values are generated by
            # `GWMOCK_WRITE_E2E_REFERENCES=1 pytest -m e2e`, not written by hand. Reformatting
            # them would mean every regeneration produced a diff of reindentation noise on top of
            # the real change, which is the opposite of what storing them in the repo is for.
            exclude: ^tests/e2e/references/

    - repo: https://github.com/DavidAnson/markdownlint-cli2
      rev: v0.23.2
      hooks:
          - id: markdownlint-cli2
            args:
                - --config
                - .markdownlint.yaml

    - repo: https://github.com/rhysd/actionlint
      rev: v1.7.12
      hooks:
          - id: actionlint

    - repo: https://github.com/astral-sh/uv-pre-commit
      rev: 0.12.12
      hooks:
          # Update the uv lockfile
          - id: uv-lock

    - repo: https://github.com/betterleaks/betterleaks
      rev: v1.8.1
      hooks:
          - id: betterleaks
