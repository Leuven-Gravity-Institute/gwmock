# git-cliff ~ configuration file
# https://git-cliff.org/docs/configuration


[changelog]
# A Tera template to be rendered for each release in the changelog.
# See https://keats.github.io/tera/docs/#introduction
body = """
{% macro print_commit(commit) -%}
    - {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
        {% if commit.breaking %}[**breaking**] {% endif %}\
        {{ commit.message | upper_first }} - \
        ([{{ commit.id | truncate(length=7, end="") }}](<REPO>/commit/{{ commit.id }}))\
        {{ self::print_contributors(commit=commit) }}\
        {% if commit.remote.pr_number %} in [#{{ commit.remote.pr_number }}](<REPO>/pull/{{ commit.remote.pr_number }}){% endif %}\
{% endmacro -%}

{#- Credits the PR author (the GitHub login git-cliff looks up for the PR, else for the commit, else
    the git author name when the lookup is unavailable) and every Co-authored-by trailer of the
    squashed commit. A co-author with a GitHub noreply address is credited by login; anyone else by
    name, never by email. A co-author who is the author already is not repeated. -#}
{% macro print_contributors(commit) -%}
    {%- set author_login = commit.remote.pr_author | default(value=commit.remote.username | default(value="")) -%}
    {%- if author_login %} by {{ self::print_login(login=author_login) }}\
    {%- else %} by {{ commit.author.name }}{% endif -%}
    {#- A commit that is not a conventional commit has no footers at all. -#}
    {%- for footer in commit.footers | default(value=[]) -%}
        {%- if footer.token | lower == "co-authored-by" -%}
            {%- set name = footer.value | split(pat=" <") | first | trim -%}
            {%- set email = footer.value | split(pat="<") | last | trim_end_matches(pat=">") | trim -%}
            {%- set login = "" -%}
            {%- if email is ending_with("@users.noreply.github.com") -%}
                {%- set login = email | split(pat="@") | first | split(pat="+") | last -%}
            {%- endif -%}
            {%- if login != author_login and name != commit.author.name -%}
                {%- if login %}, {{ self::print_login(login=login) }}{% else %}, {{ name }}{% endif -%}
            {%- endif -%}
        {%- endif -%}
    {%- endfor -%}
{% endmacro -%}

{#- A GitHub App's login ends in "[bot]", and GitHub reads "@renovate[bot]" as a mention of the user
    "renovate" followed by the text "[bot]". Link an App to its page instead of mentioning it. -#}
{% macro print_login(login) -%}
    {%- if login is ending_with("[bot]") -%}
        [{{ login | replace(from="[", to="\\[") | replace(from="]", to="\\]") }}](https://github.com/apps/{{ login | trim_end_matches(pat="[bot]") }})\
    {%- else -%}
        @{{ login }}\
    {%- endif -%}
{% endmacro -%}

{% if version %}\
    {% if previous.version %}\
        ## [{{ version | trim_start_matches(pat="v") }}]\
          (<REPO>/compare/{{ previous.version }}..{{ version }}) - {{ timestamp | date(format="%Y-%m-%d") }}
    {% else %}\
        ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
    {% endif %}\
{% else %}\
    ## [unreleased]
{% endif %}\


{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | striptags | trim | upper_first }}
    {% for commit in commits
    | filter(attribute="scope")
    | sort(attribute="scope") %}
        {{ self::print_commit(commit=commit) }}
    {%- endfor %}
    {% for commit in commits %}
        {%- if not commit.scope -%}
            {{ self::print_commit(commit=commit) }}
        {% endif -%}
    {% endfor -%}
{% endfor -%}
"""

# A Tera template to be rendered as the changelog's footer.
# See https://keats.github.io/tera/docs/#introduction
footer = """
---

**Contributing**: We welcome contributions! Please see our [Contributing Guide](<REPO>/blob/main/CONTRIBUTING.md) for details.

**Questions?** Open an issue on [GitHub](<REPO>/issues) or join our discussions.
"""

# Remove leading and trailing whitespaces from the changelog's body.
trim = true
# Render body even when there are no releases to process.
render_always = true
# An array of regex based postprocessors to modify the changelog.
postprocessors = [
  # Replace the placeholder <REPO> with a URL.
  { pattern = '<REPO>', replace = 'https://github.com/Leuven-Gravity-Institute/gwmock' },
]
# render body even when there are no releases to process
# render_always = true
# output file path
# output = "test.md"

[git]
# Parse commits according to the conventional commits specification.
# See https://www.conventionalcommits.org
conventional_commits = true
# Exclude commits that do not match the conventional commits specification.
filter_unconventional = false
# Require all commits to be conventional.
# Takes precedence over filter_unconventional.
require_conventional = false
# Split commits on newlines, treating each line as an individual commit.
split_commits = false
# An array of regex based parsers to modify commit messages prior to further processing.
commit_preprocessors = [
  # Drop the "(#123)" GitHub appends to a squash-merge title: the template links the PR itself.
  { pattern = '(?m)[ \t]*\(#[0-9]+\)$', replace = '' },
  # Replace issue numbers with link templates to be updated in `changelog.postprocessors`.
  #{ pattern = '\((\w+\s)?#([0-9]+)\)', replace = "([#${2}](<REPO>/issues/${2}))"},
  # Check spelling of the commit message using https://github.com/crate-ci/typos.
  # If the spelling is incorrect, it will be fixed automatically.
  #{ pattern = '.*', replace_command = 'typos --write-changes -' },
]
# Prevent commits that are breaking from being excluded by commit parsers.
protect_breaking_commits = false
# An array of regex based parsers for extracting data from the commit message.
# Assigns commits to groups.
# Optionally sets the commit's scope and can decide to exclude commits from further processing.
commit_parsers = [
  { message = "^Merge branch", skip = true },
  { message = "^Merge pull request", skip = true },
  { message = "^feat", group = "<!-- 0 -->🚀 Features" },
  { message = "^fix", group = "<!-- 1 -->🐛 Bug Fixes" },
  { message = "^doc", group = "<!-- 3 -->📚 Documentation" },
  { message = "^perf", group = "<!-- 4 -->⚡ Performance" },
  { message = "^refactor", group = "<!-- 2 -->🚜 Refactor" },
  { message = "^style", group = "<!-- 5 -->🎨 Styling" },
  { message = "^test", group = "<!-- 6 -->🧪 Testing" },
  { message = "^chore\\(release\\): prepare for", skip = true },
  { message = "^chore\\(pr\\)", skip = true },
  { message = "^chore\\(pull\\)", skip = true },
  { message = "^chore|^ci", group = "<!-- 7 -->⚙️ Miscellaneous Tasks" },
  { body = ".*security", group = "<!-- 8 -->🛡️ Security" },
  { message = "^revert", group = "<!-- 9 -->◀️ Revert" },
  { message = ".*", group = "<!-- 10 -->💼 Other" },
]
# Exclude commits that are not matched by any commit parser.
filter_commits = false
# An array of link parsers for extracting external references, and turning them into URLs, using regex.
link_parsers = []
# Include only the tags that belong to the current branch.
use_branch_tags = false
# Order releases topologically instead of chronologically.
topo_order = false
# Order releases topologically instead of chronologically.
topo_order_commits = true
# Order of commits in each group/release within the changelog.
# Allowed values: newest, oldest
sort_commits = "oldest"
# Process submodules commits
recurse_submodules = false

[remote.github]
# Lets the changelog credit each entry's PR author and link its PR. git-cliff reads the token from
# GITHUB_TOKEN; without one it falls back to the unauthenticated API rate limit.
owner = "Leuven-Gravity-Institute"
repo = "gwmock"
