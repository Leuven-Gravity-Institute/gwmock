globals:
    simulator-arguments:
        sampling-frequency: 4096
        duration: 1024
        start-time: 1577491218
    working-directory: .
    output-directory: output
    metadata-directory: metadata

orchestration:
    population:
        backend: FilePopulationLoader
        source-type: bbh
        n-samples: 1
        arguments:
            # The one-event population that ships with gwmock, so the quick-start needs no network
            # access.
            # Paths in a configuration are read from the directory gwmock runs in, not from this
            # file's. This one is written from this file's own directory, so run the example from
            # there -- or copy it with `gwmock config --get`, which puts the catalogue next to the
            # configuration it writes and points the path at the copy. Run from anywhere else, the
            # run stops and names the directory to run it from.
            # The same file pinned to a commit, to fetch instead:
            #   https://raw.githubusercontent.com/Leuven-Gravity-Institute/gwmock/9fa389516dfd8b818670b0ae4359e9be04f30e5e/examples/signal/bbh_population.csv
            path: ../../../signal/bbh_population.csv
    signal:
        waveform-model: IMRPhenomXPHM
        minimum-frequency: 20
        detectors:
            - ET-Triangle-Sardinia
        output:
            output_directory: signal
            file_name:
                'E-{{ detectors }}_STRAIN_BBH-{{ start_time }}-{{ duration
                }}.hdf5'
            arguments:
                channel: '{{ detectors }}:STRAIN'
    noise:
        arguments:
            psd_file: ET_10_full_cryo_psd
            seed: 42
            detectors:
                - ET-Triangle-Sardinia
        output:
            output_directory: noise
            file_name:
                'E-{{ detectors }}_STRAIN_NOISE-{{ start_time }}-{{ duration
                }}.hdf5'
            arguments:
                channel: '{{ detectors }}:STRAIN'
