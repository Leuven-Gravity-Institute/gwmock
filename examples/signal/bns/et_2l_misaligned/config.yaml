# Binary-neutron-star signals for an ET network.
#
# NOTE: this preset cannot use `execution: batched`. It generates with
# `IMRPhenomPv2_NRTidalv2`, which is precessing *and* tidal; ripple — the only library the
# batched path generates with — implements precessing models and tidal models, but not that
# combination. Adding `execution: batched` here is refused outright rather than silently
# served with a different approximant, so the failure is loud. Leave it on the default
# per-event path, which this file already uses.
#
# The approximant is a deliberate choice, not an oversight: it is the standard LAL model for
# precessing tidal BNS. Do not "fix" this by switching to a ripple-supported tidal model such
# as `IMRPhenomD_NRTidalv2` in order to unlock the device path — that one is aligned-spin, so
# it would quietly drop precession and change the physics this preset represents.
#
# Provenance for that claim: ripple 0.3.0, checked 2026-08-01. It is not left to this comment
# to stay true — `tests/e2e/test_examples_index.py` fails if ripple ever gains the
# approximant, which is when this note needs rewriting.
globals:
    simulator-arguments:
        sampling-frequency: 4096
        duration: 4096
        total-duration: 1 day
        start-time: 1000000540
    working-directory: .
    output-directory: output
    metadata-directory: metadata

orchestration:
    population:
        backend: FilePopulationLoader
        source-type: bns
        arguments:
            path: 'https://sandbox.zenodo.org/records/514722/files/mdc1_bns.h5'
    signal:
        waveform-model: IMRPhenomPv2_NRTidalv2
        minimum-frequency: 20
        # Which physical effects the detector projection includes. All six are on by default;
        # they are written out so the example says which physics produced its data.
        effects:
            earth-rotation: true
            finite-arm-length: true
            source-precession: true
            roemer-delay: true
            einstein-delay: true
            shapiro-delay: true
        detectors:
            - ET-2L-Misaligned
        output:
            output_directory: signal
            file_name:
                'E-{{ detectors }}_STRAIN_BNS-{{ start_time }}-{{ duration
                }}.hdf5'
            arguments:
                channel: '{{ detectors }}:STRAIN'
