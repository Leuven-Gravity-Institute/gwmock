[build-system]
requires = ["hatchling", "uv-dynamic-versioning"]
build-backend = "hatchling.build"

[project]
name = "gwmock"
authors = [{ name = "Isaac C. F. Wong", email = "chunfung.wong@kuleuven.be" }]
description = "A Python package for simulating gravitational wave detector data for mock data challenges."
readme = "README.md"
license = { text = "GPL-3.0-or-later" }
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "Topic :: Scientific/Engineering :: Physics",
  "Topic :: Scientific/Engineering :: Astronomy",
  "License :: OSI Approved :: GNU General Public License v3 or later (GPLv3+)",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
]
requires-python = ">=3.12"
dynamic = ["version"]
dependencies = [
  # Two floors, both behavioural rather than conveniences.
  #
  # 0.15.0 first exposed `CBCSimulator.pre_coalescence_duration`, which segment placement asks
  # before generating so an event is claimed by the segment its *waveform* starts in rather than the
  # one holding its coalescence. Below it the query is absent, placement falls back to `coa_time`,
  # and the start of any waveform landing near a boundary is cropped.
  #
  # 0.16.0 adds the other half, `post_coalescence_duration`. Without the tail, a run whose
  # start-time is later than its population's first event cannot tell that the earlier events are
  # finished, so it claims every one of them into its first segment and discards the samples; the
  # batch then grows with the distance from the catalogue start until the preflight refuses it.
  #
  # 0.16.0 also carries a projection *correctness* fix (gwmock-signal #370): the source direction is
  # projected into the frame of date, where before `gha = GMST - right_ascension` mixed a J2000 right
  # ascension with an Earth rotation measured from the mean equinox of date -- 0.43 degrees in right
  # ascension by 2030. It changes continuous-wave output, which is why the bump landed with
  # regenerated e2e references rather than inside this change.
  #
  # 0.17.0 is what makes `orchestration.signal.projection-backend` reachable: it is the first
  # release whose `CBCSimulator` takes a `projection_backend` argument, and the setting is
  # threaded to gwmock-signal as exactly that. Below this floor the key is still validated and
  # then refused when the backend is built -- never silently ignored -- but it cannot be used, so
  # the floor is what turns an actionable error into a working configuration.
  "gwmock-signal>=0.17.0",
  # 0.11.0 refuses a fractional `gps_start` when the output format is `gwf`, and is the first release
  # whose noise output config admits `hdf5`. The frame filename carries the time as an integer, so
  # below this floor two runs whose start times round to the same second compose one filename and the
  # second silently overwrites the first. The floor makes the refusal reachable rather than leaving it
  # to whichever version happens to resolve.
  "gwmock-noise>=0.11.3",
  "gwmock-pop>=0.13.1",
  "typer>=0.19.0",        # Literal-type CLI options; the SPEC 0 floor (0.13) predates them
  "tqdm>=4.67.0",
  "h5py>=3.12.1",
  "pydantic>=2.9.0",
  "pymap3d>=3.2.0",
  "psutil>=6.1.0",
  "filelock>=3.16.0",
  "textual>=2.0.0",       # Content.from_markup; the SPEC 0 floor (0.73) predates it
]

[project.optional-dependencies]
sgwb = ["gwmock-signal[sgwb]>=0.17.0"]
# The batched signal path. Without this extra `SignalAdapter.simulate_segments` and
# `execution: batched` raise, because gwmock-signal's batched entry points need JAX and ripple,
# which the base install omits.
#
# **This is CPU JAX.** The wheels resolved here carry no GPU backend, so `execution: batched`
# installed this way batches the work and runs it on the CPU. That is a supported configuration --
# it is the one the test suite exercises -- but it is not device execution, and nothing at runtime
# distinguishes the two beyond `jax.devices()`. Use the `cuda` extra below for a GPU.
#
# Floored above 0.13.0 because 0.15.0 floors `ripplegw>=0.3.1`, the first ripple
# carrying the geocentre fix (GW-JAX-Team/ripple#141). Without it the continuous-wave path gets a
# ripple that returns NaN for every sample at the geocentre, where these simulators generate. The
# floor is deliberately *not* restated here as a `ripplegw` declaration: it belongs beside the
# guard that raises on those NaNs, which lives in gwmock-signal, and stating a version in two
# repositories is how the two drift.
jax = ["gwmock-signal[jax]>=0.17.0"]
# The same path with an actual GPU backend. Linux x86_64 with a CUDA 12 driver only; there is no
# macOS or Windows wheel, which is why this is separate from `jax` rather than folded into it.
cuda = ["gwmock-signal[jax]>=0.17.0", "jax[cuda12]>=0.11.0"]
# The DeepExtractor glitch backend, `kind: deepextractor` under
# `orchestration.noise.arguments.glitches`. Its waveforms are reconstructions fetched from a
# HuggingFace dataset rather than generated, so it needs `huggingface_hub`, which the base install
# omits. Without this extra the model raises the moment it first reaches for the dataset -- when the
# run pins the dataset revision, or at the first waveform -- telling the caller to install
# `gwmock-noise[deepextractor]`, a package they never named.
#
# Floored at the `gwmock-noise` runtime floor above rather than at a new number: 0.11.2 already
# publishes this extra, so there is nothing below it that this declaration would rescue.
deepextractor = ["gwmock-noise[deepextractor]>=0.11.3"]

[dependency-groups]
dev = [
  "prek>=0.5.2",
  "pytest-cov>=7.1.0",
  "pytest-mock>=3.15.1",
  "pytest>=9.1.1",
  "pytest-asyncio>=1.4.0",
  "pytest-github-actions-annotate-failures>=0.4.2",
  "mutmut>=3.7.0",
]
docs = ["zensical>=0.0.60", "mkdocstrings-python>=2.0.8"]
build = ["hatch>=1.18.0"]
release = ["git-cliff>=2.13.1"]

[project.scripts]
gwmock = "gwmock.cli.main:app"

[project.urls]
Documentation = "https://leuven-gravity-institute.github.io/gwmock"
Source = "https://github.com/Leuven-Gravity-Institute/gwmock"
Tracker = "https://github.com/Leuven-Gravity-Institute/gwmock/issues"

[tool.dependency-support-policy]
policy = "spec0"
groups = ["project", "optional"]
# ecosystem siblings: Renovate keeps them at latest
exclude = ["gwmock-signal", "gwmock-noise", "gwmock-pop"]
lock = "minimal"

[tool.uv-dynamic-versioning]
vcs = "git"      # default
style = "semver" # or pep440, semver, etc.

[tool.hatch.version]
source = "uv-dynamic-versioning"

[tool.hatch.build.targets.wheel]
packages = ["src/gwmock"]

# Register the custom build hook
[tool.hatch.build.hooks.custom]
path = "hatch_build.py"

[tool.hatch.build.targets.sdist]
include = [
  "/src",                # Include the source code
  "/examples/**/*.yaml", # Include only YAML files from examples
  "/tests",              # Include tests for source distributions
  "/README.md",
  "/pyproject.toml",
  "/hatch_build.py",     # Include the build hook itself
]

[tool.coverage.run]
branch = true

[tool.coverage.report]
fail_under = 0

[tool.coverage.xml]
output = "coverage.xml"

[tool.pytest.ini_options]
addopts = [
  "--cov=gwmock",
  "--cov-report=xml",
  "--cov-report=term",
  "--junitxml=test-results.xml",
  "--cov-append",
  "-m",
  "not integration and not e2e",
]
pythonpath = ["src", "scripts"]
testpaths = "tests"
junit_family = "xunit2"
markers = [
  "integration: marks as integration test",
  "notebooks: marks as notebook test",
  "gpu: marks as gpu test",
  "spark: marks tests which need Spark",
  "slow: marks tests as slow",
  "unit: fast offline tests",
  # Drives an example configuration through the real CLI. Excluded from the default run via
  # `-m "not e2e"` below, because these generate data and are minutes rather than seconds; the
  # `e2e` CI job runs them, and it installs the extras the matrix needs so the optional-stack
  # entries in tests/e2e/matrix.py actually execute rather than silently skipping.
  "e2e: end-to-end tests that run an example config through the CLI",
]

[tool.mutmut]
# mutmut copies the project into `mutants/` and mutates the copy, so the working tree is untouched.
source_paths = ["src/gwmock"]
# `tests/`, `pyproject.toml` and `uv.lock` are copied by default. `examples/` is not, and
# tests/cli/utils/test_cli_utils_config.py walks the real examples tree, so it has to come along or
# every mutant is judged against a suite that errors for reasons unrelated to the mutation.
also_copy = ["examples/"]
pytest_add_cli_args_test_selection = ["tests/"]
# The default `addopts` turn on coverage, an XML report and a JUnit file. Under mutation testing
# they cost more than the test run itself and the reports get overwritten once per mutant, so the
# ini value is cleared and only the marker filter is restated. Integration, e2e and slow tests are
# excluded as well: a mutant is judged by the fast unit suite.
pytest_add_cli_args = [
  "--override-ini=addopts=",
  # The ini's `pythonpath` entries have to go too, and this one is load-bearing, not a speed-up.
  # mutmut puts `mutants/src` at the front of `sys.path` and deletes `src` from it, but pytest
  # re-inserts its `pythonpath` entries when it builds its config, so the real `src` lands back in
  # front of the mutated copy and every test imports unmutated code. mutmut then records no
  # test for any function and reports the whole package as "no tests" -- 15556 of 15960 mutants
  # never run. Clearing the ini leaves `mutants/src` as the only source on the path.
  "--override-ini=pythonpath=",
  # `tests/test_release_version.py` imports `release_version` from `scripts/`, which mutmut does
  # not copy into `mutants/` and which the cleared `pythonpath` above takes off the path. Without
  # this the import fails, pytest interrupts collection, and every mutant is then judged against a
  # suite that never ran. Skipped rather than made importable: the mutants come from `source_paths`,
  # so a release-tooling test can only add runtime here, never a verdict. Plain `pytest` runs it.
  "--ignore=tests/test_release_version.py",
  "-m",
  "not integration and not e2e and not slow",
]
# How long a worker may live: `(estimated_test_time + timeout_constant) * timeout_multiplier`.
#
# The defaults (1.0 and 15.0) put that between 15 s and 25 minutes for this suite, and the whole
# range is wrong, because `estimated_test_time` comes from the *instrumented* stats run: mutmut
# records a trampoline hit for every call through mutated code, which makes the estimate ~40x the
# real cost (its three slowest tests are recorded at 31 s each against 0.8 s measured with
# `--durations`). So the estimate already exceeds the real time on its own, and multiplying it by
# 15 buys nothing but a worker that sits for minutes.
#
# Measured against the other end: replaying the heaviest mutants one at a time -- 144 and 159
# associated tests -- takes 40 s and 50 s, against estimates of 36 s and 47 s. Doubling the
# estimate therefore keeps more than 2x headroom over anything that terminates, and the constant
# sets the floor for a mutant whose tests are instantaneous (20 s, against a per-test budget of
# 10 s in `tests/conftest.py`, so a non-terminating mutant is still caught by the failing test
# rather than by this).
#
# The reason to bound it at all: a worker that deadlocks on a lock inherited from the fork cannot
# be interrupted from Python -- it is blocked in a lock acquisition rather than in bytecode -- so
# this budget is the only thing that reaps it, and at the default it reaped them 25 minutes later.
timeout_constant = 10.0
timeout_multiplier = 2.0
# `mutate_only_covered_lines` is deliberately left off. It would cut the mutant count, but its
# coverage pass ends in `_unload_modules_not_in()`, which drops every module from `sys.modules`;
# the next in-process pytest run then re-imports numpy and dies with
# "ImportError: cannot load module more than once per process", because a C extension cannot be
# initialised twice in one interpreter. Verified on beelink, 2026-08-18.

[tool.ruff]
line-length = 120 # Matches Black's default
target-version = "py312" # Align with requires-python (>=3.12)
lint.select = [
  "E",
  "F",
  "W",   # pycodestyle errors and warnings
  "I",   # isort rules
  "UP",  # pyupgrade rules
  "C90", # McCabe complexity
  "N",   # PEP8 naming
  "B",   # Bugbear (opinionated checks)
  "A",   # Flake8-builtins
  "C4",  # Flake8-comprehensions
  "PT",  # Flake8-pytest
  "RUF", # Ruff-specific rules
  "PL",  # Add pylint rules for fuller coverage
  "SIM", # Similarities
  "T10", # Debugger statements
  "S",   # Security rules
]
lint.ignore = [
  "E501", # Line length (handled by formatter)
  "C901", # Disable overly strict complexity checks (optional, adjust as needed)
]
lint.pylint.max-args = 10
fix = true # Enable autofix
lint.unfixable = [] # List rules that should not be autofixed, if any
exclude = ["docs/conf.py"]

[tool.ruff.format]
quote-style = "double"       # Use double quotes for strings
indent-style = "space"       # Use spaces for indentation
docstring-code-format = true # Format code in docstrings

[tool.ruff.lint.per-file-ignores]
# Ignore specific rules in the tests directory
"tests/*" = ["S101", "ARG001", "PLC0415", "PLR2004"]
# S101: allow assert statements
# ARG001: allow unused function arguments (common in fixtures)
# PLC0415: allow import statements not at the top level
# PLR2004: allow magic values in the unit tests

[[tool.uv.index]]
name = "testpypi"
url = "https://test.pypi.org/simple/"
publish-url = "https://test.pypi.org/legacy/"
explicit = true
